<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <meta name="theme-color" content="#0f172a">
    <title>Sistema RRHH | Acceso</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./css/app.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="bg-[#0f172a] flex flex-col items-center justify-center min-h-screen p-6">

    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-10">
        <div class="flex flex-col items-center mb-8">
            <img src="./logo.png" alt="Logo Empresa" class="h-16 object-contain">
            <div class="h-1 w-12 bg-blue-600 mt-4 rounded-full"></div>
            <p class="text-gray-400 text-[10px] uppercase tracking-widest mt-4 font-bold">Recursos Humanos</p>
        </div>

        <form id="login-form" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Email</label>
                <input type="email" id="email-input" required
                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all"
                    placeholder="usuario@empresa.com">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Contrasena</label>
                <input type="password" id="password-input" required
                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all"
                    placeholder="********">
            </div>

            <div id="error-message" class="hidden flex items-center gap-2 text-red-500 text-xs bg-red-50 p-3 rounded-xl border border-red-100">
                <i class="ph ph-warning-circle text-lg"></i>
                <span id="error-text">Credenciales incorrectas</span>
            </div>

            <button type="submit" id="login-btn"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg transition-all active:scale-95 flex justify-center items-center gap-2">
                <span id="btn-label">Entrar</span>
                <div id="btn-spinner" class="hidden w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
            </button>
        </form>
    </div>

    <footer class="mt-6 text-center text-[11px] font-bold text-slate-300">
        <p>© 2026 Giuliano Emanuel Maria Catella Riveros (Otelax Dev) · Licencia MIT (atribución obligatoria) · <a href="https://www.dev.otelax.com" target="_blank" rel="noopener noreferrer" class="text-blue-300 hover:text-blue-200">www.dev.otelax.com</a></p>
    </footer>

    <script type="module" src="js/login.js"></script>
</body>
</html>
