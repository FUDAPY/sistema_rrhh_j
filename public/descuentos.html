<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#0f172a" />
        <title>Reportar Descuento | Sistema RRHH</title>
        <link rel="apple-touch-icon" href="./icons/icon-192.png" />
        <link rel="manifest" href="./manifest.webmanifest" />
        <link rel="stylesheet" href="./css/app.css" />
        <script src="https://unpkg.com/@phosphor-icons/web"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap"
            rel="stylesheet"
        />
        <style>
            body { font-family: 'Inter', sans-serif; }
            .fade-in { animation: fadeIn 0.3s ease-in-out; }
            @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        </style>
    </head>
    <body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-white rounded-[40px] shadow-2xl border border-slate-200 overflow-hidden fade-in">
            <div class="bg-gradient-to-r from-red-600 to-rose-600 p-8 text-center relative">
                <div class="absolute top-4 right-6 opacity-20 text-white text-6xl">
                    <i class="ph-fill ph-warning-circle"></i>
                </div>
                <h1 class="text-2xl font-black text-white relative z-10 tracking-tight">Reportar Descuento</h1>
                <p class="text-red-100 text-xs font-bold uppercase tracking-widest mt-1 relative z-10 opacity-80">
                    Módulo de Administración
                </p>
            </div>

            <form id="publicDescForm" class="p-8 space-y-5">
                <div class="relative">
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-[2px] mb-2 px-1"
                        >Funcionario</label
                    >
                    <div class="relative">
                        <i class="ph-bold ph-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input
                            type="text"
                            id="searchEmp"
                            placeholder="Buscar por nombre..."
                            autocomplete="off"
                            class="w-full bg-slate-50 border-2 border-slate-100 py-3.5 pl-11 pr-4 rounded-2xl font-bold text-slate-700 outline-none focus:border-red-500 focus:bg-white transition-all"
                        />
                    </div>

                    <div
                        id="empList"
                        class="hidden absolute w-full bg-white border border-slate-200 rounded-2xl shadow-2xl mt-2 max-h-48 overflow-y-auto z-50 animate-fade-in"
                    ></div>
                    <input type="hidden" id="selectedEmpId" />
                </div>

                <div class="grid grid-cols-1 gap-5">
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-[2px] mb-2 px-1"
                            >Fecha del Incidente</label
                        >
                        <div class="relative">
                            <i
                                class="ph-bold ph-calendar-blank absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"
                            ></i>
                            <input
                                type="date"
                                id="descDate"
                                required
                                class="w-full bg-slate-50 border-2 border-slate-100 py-3.5 pl-11 pr-4 rounded-2xl font-bold text-slate-600 outline-none focus:border-red-500 focus:bg-white transition-all"
                            />
                        </div>
                    </div>

                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-[2px] mb-2 px-1"
                            >Monto a Descontar (Gs)</label
                        >
                        <div class="relative">
                            <span class="absolute left-4 top-1/2 -translate-y-1/2 font-black text-red-600">Gs.</span>
                            <input
                                type="text"
                                id="amountDisplay"
                                placeholder="0"
                                required
                                class="w-full bg-red-50/50 border-2 border-red-100 py-4 pl-12 pr-4 rounded-2xl font-black text-red-600 text-2xl outline-none focus:border-red-500 focus:bg-white transition-all"
                            />
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-[2px] mb-2 px-1"
                        >Motivo / Concepto</label
                    >
                    <div class="relative">
                        <i class="ph-bold ph-info absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <select
                            id="reasonType"
                            required
                            class="w-full bg-slate-50 border-2 border-slate-100 py-3.5 pl-11 pr-10 rounded-2xl font-bold text-slate-600 outline-none focus:border-red-500 focus:bg-white appearance-none transition-all cursor-pointer"
                        >
                            <option value="">Seleccione el motivo...</option>
                            <option value="FALTANTE DE CAJA">FALTANTE DE CAJA</option>
                            <option value="FALTANTE DE STOCK">FALTANTE DE STOCK</option>
                            <option value="CONSUMISION">CONSUMISIÓN</option>
                            <option value="DAÑO DE PROPIEDAD">DAÑO DE PROPIEDAD</option>
                            <option value="SANCION DISCIPLINARIA">SANCIÓN DISCIPLINARIA</option>
                        </select>
                        <i
                            class="ph-bold ph-caret-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"
                        ></i>
                    </div>
                </div>

                <div class="pt-4">
                    <button
                        type="submit"
                        id="btnSubmit"
                        class="w-full bg-slate-900 text-white py-5 rounded-2xl font-black shadow-xl shadow-slate-200 hover:bg-red-600 hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-3 group"
                    >
                        <i class="ph-bold ph-check-circle text-xl group-hover:animate-bounce"></i>
                        CONFIRMAR DESCUENTO
                    </button>
                </div>
            </form>

            <div id="successMessage" class="hidden p-12 text-center animate-fade-in">
                <div
                    class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-6"
                >
                    <i class="ph-fill ph-check-circle text-5xl"></i>
                </div>
                <h3 class="text-2xl font-black text-slate-800 tracking-tight">¡Registro Exitoso!</h3>
                <p class="text-slate-500 text-sm mt-2 font-medium">
                    El descuento ha sido aplicado al historial del funcionario.
                </p>
                <button
                    onclick="window.location.reload()"
                    class="mt-8 bg-slate-100 text-slate-600 px-8 py-3 rounded-xl font-bold text-sm hover:bg-slate-200 transition-all"
                >
                    Realizar otro registro
                </button>
            </div>

            <div class="bg-slate-50 p-4 text-center border-t border-slate-100">
                <p class="text-[10px] text-slate-400 font-bold uppercase">SISTEMA LIN GROUP v5.7.0</p>
                <p class="text-[10px] text-slate-400 font-medium mt-1">
                    © 2026 Giuliano E. M. Catella Riveros (Otelax Dev) · Licencia MIT (atribucion obligatoria)
                </p>
            </div>
        </div>

        <script type="module" src="js/descuentos-public.js"></script>
    </body>
</html>
